\* Every rule. Three runs/sends, fullscreen and back, every host ability.
\* At the sync commit all hold; a break here is a regression or a finding.
SPECIFICATION Spec
CONSTANTS
    MaxId = 3
    RunAbilities = {TRUE, FALSE}
    SendAbilities = {TRUE, FALSE}
    Drafts = {"agent", "read", "write", "bad"}
CONSTRAINT Bounded
CHECK_DEADLOCK FALSE
INVARIANTS
    AbandonedReplyIgnored
    WriteReachesChatOnce
    ChatGotItCardSaysSo
    OnlyReadsRun
    RunsOnlyWhereHostRuns
    SendsOnlyWhereHostSends
    SendAlwaysTimed
