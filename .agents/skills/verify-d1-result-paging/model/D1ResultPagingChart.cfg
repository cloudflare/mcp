\* For the full chart only (read it with chart-view.mjs): one row a block and a page, the agent's result 3 rows
\* (3 blocks), the user's 1 row, at most 2 reads or runs. Small enough for the chart budget; the checks are
\* D1ResultPaging.cfg and D1ResultPagingDeep.cfg.
SPECIFICATION Spec
CONSTANTS
  MAX_ROWS = 1
  PAGE = 1
  AGENT_ROWS = 3
  USER_ROWS = 1
  MaxId = 2
  Variant = "none"
INVARIANT TypeOK RowsOnScreenMatchHeader PageIsTheOneAsked ReadCanLand CopyFirstNIsTrue
