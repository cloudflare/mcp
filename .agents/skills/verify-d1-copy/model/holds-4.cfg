\* Every rule, with one more copy. Leave out a rule that breaks here, so that
\* TLC explores every state for the others (see SKILL.md).
CONSTANTS
  Trios = {"A", "B"}
  Formats = {"csv", "json"}
  MaxCopies = 4
  SlowHost = FALSE
  SdkTimeout = TRUE
  WithSql = TRUE
  Sandboxes = {"open", "noWrite", "closed"}
  Mutation = "none"
