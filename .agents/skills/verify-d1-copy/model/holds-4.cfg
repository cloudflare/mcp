INVARIANTS
  TypeOK
  ClipboardHoldsLastCopy
  ToastDescribesLatestCopy
  NoCheckDuringCopyAll
  NoCheckOnTrioWhileItReads
  NoCheckAfterFailure
  CheckOnlyOnCompletedCopy
  BlockedIsReported
  BlockedNeverShownCopied
  CopyAllMarksItsFormat
PROPERTIES
  ReadingToastEnds
