name: Forge tools

# Every six hours, regenerates src/generated/forge-mcp, the direct tools served
# at /mcp?forge=true, from the latest openapi.forge.json Forge release with the
# forge commit that forge.json names. When the generated code changes, it opens
# or updates one pull request; merging it deploys through Workers Builds.
#
# The pull request is opened as the agent-think GitHub App (team-apps, in
# cloudflare/ai-agents) when its AGENT_THINK_APP_ID and AGENT_THINK_PRIVATE_KEY
# secrets are set, so CI runs on it as on any pull request. Without them it
# falls back to GITHUB_TOKEN, whose pull requests don't start other workflows;
# this job runs the type check and tests itself either way.

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: forge-tools
  cancel-in-progress: false

env:
  BRANCH: bot/forge-tools
  TITLE: 'chore(forge): regenerate the forge MCP tools'
  HAS_APP: ${{ secrets.AGENT_THINK_APP_ID != '' }}

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest
    steps:
      - name: Mint an agent-think token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AGENT_THINK_APP_ID }}
          private-key: ${{ secrets.AGENT_THINK_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app.outputs.token || github.token }}

      - name: Read forge.json
        id: forge
        run: |
          echo "repository=$(jq -r .repository forge.json)" >> "$GITHUB_OUTPUT"
          echo "ref=$(jq -r .ref forge.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          repository: ${{ steps.forge.outputs.repository }}
          ref: ${{ steps.forge.outputs.ref }}
          path: .forge

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .forge/target
          key: forge-${{ runner.os }}-${{ steps.forge.outputs.ref }}

      # rustup reads .forge/rust-toolchain.toml and installs that toolchain.
      - name: Build forge
        working-directory: .forge
        run: cargo build --release --bin forge

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate
        env:
          FORGE_BINARY: .forge/target/release/forge
        run: npm run generate:tools -- --summary "$RUNNER_TEMP/summary.md"

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- src/generated/forge-mcp)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Type check
        if: steps.changes.outputs.changed == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.changes.outputs.changed == 'true'
        run: npm run test

      - name: Open or update the pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          FORGE_REF: ${{ steps.forge.outputs.ref }}
        run: |
          if [ -n "$APP_SLUG" ]; then
            user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          fi
          git checkout -B "$BRANCH"
          git add src/generated/forge-mcp
          git commit -q -m "$TITLE"
          git push -q --force origin "$BRANCH"
          {
            echo "Regenerated from the latest \`openapi.forge.json\` with forge \`${FORGE_REF:0:12}\`. Merging deploys the new tools to \`/mcp?forge=true\`."
            echo
            cat "$RUNNER_TEMP/summary.md"
          } > "$RUNNER_TEMP/body.md"
          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null)" = OPEN ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi
