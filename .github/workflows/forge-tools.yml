name: Forge tools

# Every six hours, regenerates src/generated/forge-mcp from the latest
# openapi.forge.json Forge release with the @cloudflare/forge package that
# package.json pins, a pkg.pr.new build of a forge commit.
# Its source.json pins the release the whole deployment serves: the forge
# tools, and the spec artifacts in src/generated/spec that the forge tools
# service serves to Code Mode and the endpoint tools. When the
# generated code changes, it opens or updates one pull request; merging it
# deploys through Workers Builds, and the ten-minute cron syncs R2 to the pin.
#
# Pull requests opened with GITHUB_TOKEN don't start other workflows, so this
# job runs the type check and tests itself before opening one.

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: forge-tools
  cancel-in-progress: false

env:
  BRANCH: bot/forge-tools
  TITLE: 'chore(spec): update the OpenAPI spec and the forge MCP tools'

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The forge commit whose @cloudflare/forge build package.json pins, for the pull request.
      - name: Read the forge pin
        id: forge
        run: |
          pin="$(jq -r '.devDependencies["@cloudflare/forge"]' package.json)"
          echo "ref=${pin##*@}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run generate:tools -- --summary "$RUNNER_TEMP/summary.md"

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- src/generated)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Type check
        if: steps.changes.outputs.changed == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.changes.outputs.changed == 'true'
        run: npm run test

      - name: Open or update the pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FORGE_REF: ${{ steps.forge.outputs.ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add src/generated
          git commit -q -m "$TITLE"
          git push -q --force origin "$BRANCH"
          {
            echo "Pins the latest \`openapi.forge.json\` and regenerates the forge MCP tools with forge \`${FORGE_REF:0:12}\`. Merging deploys the new tools to \`/mcp?codemode=false&experimentalForge=true\`, and within ten minutes Code Mode and the endpoint tools serve this spec too."
            echo
            cat "$RUNNER_TEMP/summary.md"
          } > "$RUNNER_TEMP/body.md"
          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null)" = OPEN ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi
